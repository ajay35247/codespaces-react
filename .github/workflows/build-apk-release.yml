name: Build Android Release (Signed APK + AAB)

# Produces a Play Store-ready signed APK and AAB.
#
# Triggers:
#   * workflow_dispatch — manual run from the Actions tab.
#   * push of a tag matching `v*` (e.g. v1.0.0) — cuts a release build.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   * ANDROID_KEYSTORE_BASE64    — `base64 -w0 upload.jks`
#   * ANDROID_KEYSTORE_PASSWORD  — keystore password
#   * ANDROID_KEY_ALIAS          — key alias (e.g. speedy-trucks)
#   * ANDROID_KEY_PASSWORD       — key password
#
# If any of those secrets are missing the job fails fast in the
# "Restore keystore" step rather than producing an unsigned artifact.
#
# Optional VITE_* variables/secrets (same as build-apk.yml) inject the
# correct backend URLs into the bundle at build time.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_FALLBACK_URL: ${{ vars.VITE_API_FALLBACK_URL }}
          VITE_ADMIN_PANEL_PATH: ${{ vars.VITE_ADMIN_PANEL_PATH }}
          VITE_ADMIN_API_SEGMENT: ${{ vars.VITE_ADMIN_API_SEGMENT }}
          VITE_ADMIN_PRIVATE_PATH_SEGMENT: ${{ vars.VITE_ADMIN_PRIVATE_PATH_SEGMENT }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
          VITE_GOOGLE_MAP_API_KEY: ${{ secrets.VITE_GOOGLE_MAP_API_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAP_API_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: npm run build -- --mode=production 2>/dev/null || npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See docs/MOBILE-BUILD.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          # Sanity-check: file is non-empty and a valid keystore archive.
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Decoded keystore is empty — secret is malformed."
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble signed release APK + AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify signed outputs
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          for f in "$APK" "$AAB"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected output not found: $f"
              find android -name "*.apk" -o -name "*.aab" 2>/dev/null
              exit 1
            fi
            ls -lh "$f"
          done

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: speedy-trucks-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: speedy-trucks-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
