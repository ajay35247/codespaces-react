name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install npm dependencies
      # NOTE: do NOT pass --no-optional. Rollup ships its Linux x64 native
      # binary (@rollup/rollup-linux-x64-gnu) as an optional dependency and
      # Vite's build will crash without it. Use npm ci for a reproducible
      # install from package-lock.json.
      run: npm ci --legacy-peer-deps

    - name: Build web app (skip tests)
      # The Vite build inlines `import.meta.env.VITE_*` values into the
      # bundle that `cap sync` later copies into the APK.  Configure these
      # under repo Settings → Secrets and variables → Actions:
      #   - Variables: VITE_API_URL, VITE_API_FALLBACK_URL,
      #     VITE_ADMIN_PRIVATE_PATH_SEGMENT, VITE_ADMIN_PANEL_PATH,
      #     VITE_ADMIN_API_SEGMENT, VITE_APP_ENV
      #   - Secrets:   VITE_GOOGLE_MAP_API_KEY, VITE_RAZORPAY_KEY_ID
      # If a value is unset the build falls back to dev defaults, which
      # produces an APK that talks to localhost — fine for smoke tests but
      # not for "live with web" parity.
      env:
        VITE_API_URL: ${{ vars.VITE_API_URL }}
        VITE_API_FALLBACK_URL: ${{ vars.VITE_API_FALLBACK_URL }}
        VITE_ADMIN_PANEL_PATH: ${{ vars.VITE_ADMIN_PANEL_PATH }}
        VITE_ADMIN_API_SEGMENT: ${{ vars.VITE_ADMIN_API_SEGMENT }}
        VITE_ADMIN_PRIVATE_PATH_SEGMENT: ${{ vars.VITE_ADMIN_PRIVATE_PATH_SEGMENT }}
        VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
        VITE_GOOGLE_MAP_API_KEY: ${{ secrets.VITE_GOOGLE_MAP_API_KEY }}
        VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAP_API_KEY }}
        VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
      run: npm run build -- --mode=production 2>/dev/null || npm run build

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Capacitor sync Android
      # `cap sync android` copies the Vite `dist/` output into the native
      # project AND regenerates `android/capacitor-cordova-android-plugins/`
      # (including `cordova.variables.gradle`, which is referenced from
      # `android/app/capacitor.build.gradle` and is gitignored). Skipping
      # this step makes Gradle fail with "Could not read script
      # '.../capacitor-cordova-android-plugins/cordova.variables.gradle'".
      run: npx cap sync android

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Decode upload keystore
      # When the `ANDROID_KEYSTORE_BASE64` secret is set the base64-encoded
      # `upload.jks` is decoded into `android/app/release.keystore`, which is
      # the path `android/app/build.gradle` looks for. When the secret is
      # absent (e.g. on PRs from forks) this step is a no-op and Gradle
      # falls back to an unsigned release build — debug build still works.
      #
      # NOTE: the `secrets` context is not allowed in step-level `if:`
      # expressions, so the presence check is performed inside the shell
      # script via the env var. See build-apk-release.yml for the same
      # pattern.
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "ANDROID_KEYSTORE_BASE64 secret is not set — skipping keystore decode (release build will be unsigned)."
          exit 0
        fi
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
        if [ ! -s android/app/release.keystore ]; then
          echo "::error::Decoded keystore is empty — check ANDROID_KEYSTORE_BASE64 secret"
          exit 1
        fi
        echo "Keystore written ($(wc -c < android/app/release.keystore) bytes)"

    - name: Build Android APK (debug) and AAB (release)
      # Run Gradle without piping through `tail`, otherwise the pipe's exit
      # status (always 0 from `tail`) masks Gradle failures and the job
      # reports success even when no APK is produced.
      #
      # `bundleRelease` produces the signed `.aab` for Play Store upload.
      # `ANDROID_VERSION_CODE` is read by `app/build.gradle` so each CI run
      # gets a monotonically-increasing versionCode (Play rejects re-uploads
      # of equal-or-lower versionCodes).
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_VERSION_CODE:      ${{ github.run_number }}
      run: |
        cd android
        ./gradlew clean assembleDebug bundleRelease --no-daemon --stacktrace

    - name: Check build outputs
      run: |
        echo "--- Debug APK ---"
        if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
        else
          echo "Debug APK not found"
          find android -name "*.apk" 2>/dev/null
        fi
        echo "--- Release AAB ---"
        if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
          ls -lh android/app/build/outputs/bundle/release/app-release.aab
        else
          echo "Release AAB not found"
          find android -name "*.aab" 2>/dev/null
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: speedy-trucks-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload AAB (Play Store bundle)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: speedy-trucks-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
        if-no-files-found: warn
        retention-days: 30