<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speedy Trucks — Horizontal Lockup
  Mark + Wordmark for navigation bars, headers, footers, presentations.
  Designed for 280x80 to billboard scales. Uses system-stack typography
  to render identically without font hosting; downstream consumers
  may switch to Inter / Geist / SF Pro by overriding font-family.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Speedy Trucks">
  <title>Speedy Trucks</title>
  <defs>
    <linearGradient id="stl-cobalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3D91"/>
      <stop offset="55%" stop-color="#0A2F73"/>
      <stop offset="100%" stop-color="#062463"/>
    </linearGradient>
    <linearGradient id="stl-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stl-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Mark (scaled from 512 -> 160 viewport units, positioned at 20,20) -->
  <g transform="translate(20 20) scale(0.3125)">
    <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#stl-cobalt)"/>
    <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#stl-glass)"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="44">
      <path d="M130 196 L190 256 L130 316" stroke="#FFFFFF" stroke-opacity="0.32"/>
      <path d="M230 196 L290 256 L230 316" stroke="#FFFFFF" stroke-opacity="0.72"/>
      <path d="M330 196 L390 256 L330 316" stroke="url(#stl-amber)"/>
    </g>
    <rect x="130" y="376" width="260" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.12"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Inter','Geist','SF Pro Display',system-ui,-apple-system,'Segoe UI',sans-serif" text-rendering="geometricPrecision">
    <text x="208" y="106" font-size="64" font-weight="800" letter-spacing="-1.6" fill="#0B3D91">SPEEDY</text>
    <text x="208" y="160" font-size="36" font-weight="700" letter-spacing="14" fill="#F59E0B">TRUCKS</text>
  </g>
</svg>
