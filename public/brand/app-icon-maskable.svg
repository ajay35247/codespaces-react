<?xml version="1.0" encoding="UTF-8"?>
<!--
  Speedy Trucks — Maskable Adaptive App Icon (Android / Material You / iOS)
  Safe zone: inner 80% (80px padding on a 512 canvas). The mark itself is
  centered in the safe zone so OS-level circular/squircle/teardrop masks
  never crop the chevrons. Bleed area extends the cobalt full-bleed so
  edge-mask shapes still render seamless brand color.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Speedy Trucks">
  <title>Speedy Trucks</title>
  <defs>
    <linearGradient id="sta-cobalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3D91"/>
      <stop offset="55%" stop-color="#0A2F73"/>
      <stop offset="100%" stop-color="#062463"/>
    </linearGradient>
    <linearGradient id="sta-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed cobalt fill (covers entire 512x512 for any mask shape) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#sta-cobalt)"/>

  <!-- Mark scaled to fit within Android maskable safe zone (60% of canvas) -->
  <g transform="translate(102 102) scale(0.6055)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="44">
      <path d="M130 196 L190 256 L130 316" stroke="#FFFFFF" stroke-opacity="0.32"/>
      <path d="M230 196 L290 256 L230 316" stroke="#FFFFFF" stroke-opacity="0.72"/>
      <path d="M330 196 L390 256 L330 316" stroke="url(#sta-amber)"/>
    </g>
  </g>
</svg>
