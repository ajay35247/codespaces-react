# docker-compose.dev.yml — Local development stack
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up --build
#
# Services started:
#   frontend  → http://localhost:3000  (Vite dev server with HMR)
#   backend   → http://localhost:5000  (nodemon with hot-reload)
#   mongo     → localhost:27017
#   redis     → localhost:6379
#
# Copy .env.dev.example → .env.dev and fill in the values before starting.
# The file is git-ignored; never commit it.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    ports:
      - '3000:3000'
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_GOOGLE_MAP_API_KEY=${VITE_GOOGLE_MAP_API_KEY:-}
      - VITE_RAZORPAY_KEY_ID=${VITE_RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - VITE_ADMIN_PANEL_PATH=${VITE_ADMIN_PANEL_PATH:-/admin-dev}
      - VITE_ADMIN_API_SEGMENT=${VITE_ADMIN_API_SEGMENT:-_dev_admin}
      - VITE_ADMIN_PRIVATE_PATH_SEGMENT=${VITE_ADMIN_PRIVATE_PATH_SEGMENT:-_dev_admin}
      - VITE_APP_ENV=development
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
      target: dev
    ports:
      - '5000:5000'
    volumes:
      - ./backend/src:/app/src
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/speedy-trucks-dev
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_replace_in_prod}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_replace_in_prod}
      - JWT_EXPIRE=${JWT_EXPIRE:-15m}
      - JWT_REFRESH_EXPIRE=${JWT_REFRESH_EXPIRE:-7d}
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - EMAIL_PORT=${EMAIL_PORT:-1025}
      - EMAIL_USER=${EMAIL_USER:-dev}
      - EMAIL_PASS=${EMAIL_PASS:-dev}
      - EMAIL_FROM=${EMAIL_FROM:-Speedy Trucks Dev <noreply@localhost>}
      - EMAIL_SECURE=false
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-placeholder}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-placeholder}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@dev.local}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-Admin@Dev1234!}
      - ADMIN_PRIVATE_PATH_SEGMENT=${ADMIN_PRIVATE_PATH_SEGMENT:-_dev_admin}
      - COOKIE_SECURE=false
      - AUTH_COOKIE_SAME_SITE=lax
      - RATE_LIMIT_WINDOW=900000
      - RATE_LIMIT_MAX=1000
      - USE_CLUSTER=false
      - REQUIRE_ADMIN_MFA_EMAIL=false
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - '27017:27017'
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: MailHog for local email testing
  # Access UI at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI
    restart: unless-stopped

volumes:
  mongo_dev_data:
